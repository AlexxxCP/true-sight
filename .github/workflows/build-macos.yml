name: Build macOS Client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install qt@6 openssl cmake ninja

      - name: Configure
        run: |
          cmake -S client \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Find application
        run: |
          echo "Searching for .app..."
          find build -name "*.app" -type d -print

      - name: Package application
        run: |
          mkdir -p package

          APP=$(find build -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found!"
            exit 1
          fi

          echo "Found: $APP"

          cp -R "$APP" package/TrueSight.app

          cd package
          zip -r TrueSight-macOS.zip TrueSight.app

      - name: Upload macOS client
        uses: actions/upload-artifact@v4
        with:
          name: TrueSight-macOS
          path: package/TrueSight-macOS.zip
