name: Build macOS Client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install qt@6 openssl cmake ninja

      - name: Configure
        run: |
          cmake -S client \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Inspect build
        run: |
          echo "=== BUILD FILES ==="
          find build -maxdepth 5 -type f -print

          echo "=== EXECUTABLES ==="
          find build -type f -perm +111 -print

          echo "=== APP BUNDLES ==="
          find build -name "*.app" -print

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: TrueSightClient-build
          path: build/
