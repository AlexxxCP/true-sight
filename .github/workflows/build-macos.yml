name: Build macOS Client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install qt@6 openssl cmake ninja

      - name: Configure
        run: |
          cmake -S client \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p package
          cp -R build/TrueSightClient.app package/

          cd package
          zip -r TrueSightClient-macOS.zip TrueSightClient.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueSightClient-macOS
          path: package/TrueSightClient-macOS.zip
